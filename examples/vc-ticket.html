<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Ticket - jsonos Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": [
    "https://www.w3.org/2018/credentials/v1",
    {"schema": "http://schema.org/"}
  ],
  "@id": "#ticket",
  "@type": "https://www.w3.org/2018/credentials#VerifiableCredential",
  "@view": "https://jsonos.com/examples/src/panes/vc.js",
  "schema:name": "Web Summit 2025 - VIP Access",
  "schema:description": "Full access to Europe's largest tech conference. All keynotes, workshops, networking events, and exclusive VIP lounge. November 11-14, Lisbon, Portugal.",
  "https://www.w3.org/2018/credentials#issuer": {
    "@id": "https://websummit.com"
  },
  "https://www.w3.org/2018/credentials#issuanceDate": "2025-06-01T00:00:00Z",
  "https://www.w3.org/2018/credentials#expirationDate": "2025-11-15T00:00:00Z",
  "https://www.w3.org/2018/credentials#credentialSubject": {
    "@id": "did:example:holder123",
    "@type": "schema:Person"
  }
}
</script>

<script src="https://unpkg.com/solid-shim/dist/mashlib.min.js"></script>

</body>
</html>
