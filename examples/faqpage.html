<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Solid FAQ - FAQPage</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#faq",
  "@type": "schema:FAQPage",
  "schema:name": "Solid Project FAQ",
  "schema:description": "Frequently asked questions about the Solid project and decentralized data storage.",
  "schema:mainEntity": [
    {
      "@type": "schema:Question",
      "schema:name": "What is Solid?",
      "schema:acceptedAnswer": {
        "@type": "schema:Answer",
        "schema:text": "Solid is a specification that lets people store their data securely in decentralized data stores called Pods. Pods are like secure personal web servers for your data. You can grant or revoke access to any person or application at any time."
      }
    },
    {
      "@type": "schema:Question",
      "schema:name": "Who created Solid?",
      "schema:acceptedAnswer": {
        "@type": "schema:Answer",
        "schema:text": "Solid was created by Sir Tim Berners-Lee, the inventor of the World Wide Web. He started the project at MIT and continues to lead its development through Inrupt and the Solid Community."
      }
    },
    {
      "@type": "schema:Question",
      "schema:name": "How do I get a Pod?",
      "schema:acceptedAnswer": {
        "@type": "schema:Answer",
        "schema:text": "You can get a free Pod from providers like solidcommunity.net, inrupt.net, or solidweb.org. Simply visit one of these providers and sign up. You can also host your own Pod server if you prefer complete control."
      }
    },
    {
      "@type": "schema:Question",
      "schema:name": "Is Solid free to use?",
      "schema:acceptedAnswer": {
        "@type": "schema:Answer",
        "schema:text": "Yes! Solid is an open-source project and the specification is free to implement. Many Pod providers offer free accounts, and all the core software is open source and free to use."
      }
    }
  ]
}
</script>

<script type="module">
import { init } from './src/shared.js';
import pane from './src/panes/faqpage.js';

init({ pane, subject: '#faq' });
</script>

</body>
</html>
