<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Berners-Lee - Composite Profile</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div class="container" id="profile"></div>

<script type="application/ld+json" id="data">
{
  "@context": {
    "foaf": "http://xmlns.com/foaf/0.1/",
    "vcard": "http://www.w3.org/2006/vcard/ns#",
    "rdfs": "http://www.w3.org/2000/01/rdf-schema#"
  },
  "@id": "#timbl",
  "@type": "foaf:Person",
  "foaf:name": "Tim Berners-Lee",
  "foaf:img": {"@id": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sir_Tim_Berners-Lee_%28cropped%29.jpg/440px-Sir_Tim_Berners-Lee_%28cropped%29.jpg"},
  "foaf:depiction": {"@id": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sir_Tim_Berners-Lee_%28cropped%29.jpg/440px-Sir_Tim_Berners-Lee_%28cropped%29.jpg"},
  "vcard:hasPhoto": {"@id": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sir_Tim_Berners-Lee_%28cropped%29.jpg/440px-Sir_Tim_Berners-Lee_%28cropped%29.jpg"},
  "foaf:mbox": "mailto:timbl@w3.org",
  "foaf:homepage": "https://www.w3.org/People/Berners-Lee/",
  "foaf:based_near": "Cambridge, MA",
  "rdfs:comment": "Inventor of the World Wide Web. Director of W3C. Founder of the Web Foundation. Leading the Solid project to re-decentralize the web and give people control over their data.",
  "vcard:fn": "Tim Berners-Lee",
  "vcard:role": "CoFounder and CTO",
  "vcard:organization-name": "Inrupt Inc",
  "foaf:account": [
    {"@id": "https://github.com/timbl"},
    {"@id": "https://twitter.com/timberners_lee"},
    {"@id": "https://www.linkedin.com/in/timbl"}
  ],
  "foaf:knows": [
    {
      "@id": "#melvin",
      "@type": "foaf:Person",
      "foaf:name": "Melvin Carvalho"
    },
    {
      "@id": "#ruben",
      "@type": "foaf:Person",
      "foaf:name": "Ruben Verborgh"
    }
  ]
}
</script>

<script src="https://unpkg.com/solid-shim/dist/mashlib.min.js"></script>

<script type="module">
  const pane = await import('./src/panes/person-composite.js').then(m => m.default)

  const jsonLdScript = document.querySelector('script[type="application/ld+json"]')
  const data = JSON.parse(jsonLdScript.textContent)

  const baseUri = window.location.href.split('#')[0]
  const subject = window.solidShim.parseJsonLdToStore(data, baseUri, SolidLogic.store)

  // Manually add photo as NamedNode (parseJsonLdToStore doesn't handle @id properly)
  const VCARD = $rdf.Namespace('http://www.w3.org/2006/vcard/ns#')
  const FOAF = $rdf.Namespace('http://xmlns.com/foaf/0.1/')
  const photoUrl = 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Sir_Tim_Berners-Lee_%28cropped%29.jpg/440px-Sir_Tim_Berners-Lee_%28cropped%29.jpg'
  SolidLogic.store.add(subject, VCARD('hasPhoto'), $rdf.sym(photoUrl))
  SolidLogic.store.add(subject, FOAF('img'), $rdf.sym(photoUrl))
  SolidLogic.store.add(subject, FOAF('depiction'), $rdf.sym(photoUrl))

  // Use the full SolidLogic context that solid-panes expects
  const context = {
    dom: document,
    session: {
      store: SolidLogic.store,
      paneRegistry: panes,
      logic: SolidLogic.solidLogicSingleton
    },
    getOutliner: () => panes.getOutliner(document),
    statusArea: document.createElement('div'),
    div: document.getElementById('profile')
  }

  const rendered = pane.render(subject, context)
  document.getElementById('profile').appendChild(rendered)
</script>

</body>
</html>
