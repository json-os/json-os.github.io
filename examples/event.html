<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Solid World - Event</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#event",
  "@type": "schema:Event",
  "@view": "https://jsonos.com/examples/src/panes/event.js",
  "schema:name": "Solid World",
  "schema:description": "Monthly community call for the Solid project. Join us to hear updates and connect with the community.",
  "schema:startDate": "2025-02-06T16:00:00Z",
  "schema:endDate": "2025-02-06T17:00:00Z",
  "schema:eventStatus": "EventScheduled",
  "schema:location": "Online - Jitsi Meet",
  "schema:url": { "@id": "https://meet.jit.si/solid-world" },
  "schema:organizer": {
    "@type": "schema:Organization",
    "schema:name": "Solid Project",
    "schema:url": { "@id": "https://solidproject.org" }
  },
  "schema:image": { "@id": "https://solidproject.org/assets/img/solid-emblem.svg" }
}
</script>

<script type="module">
import { init } from './src/shared.js';
import pane from './src/panes/event.js';

init({ pane, subject: '#event' });
</script>

</body>
</html>
