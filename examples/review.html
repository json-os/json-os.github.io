<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#review",
  "@type": "schema:Review",
  "schema:name": "Best headphones I've ever owned",
  "schema:reviewBody": "After using these headphones for 3 months, I can confidently say they're worth every penny. The noise cancellation is incredible - I use them on my daily commute and can't hear a thing. The sound quality is rich and balanced, perfect for all genres. Battery life easily lasts my entire work week. The only minor issue is they can get warm during extended use, but that's a small price for this level of quality.",
  "schema:datePublished": "2024-01-15",
  "schema:author": {
    "@type": "schema:Person",
    "schema:name": "Alex Thompson",
    "schema:image": { "@id": "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&q=80" }
  },
  "schema:reviewRating": {
    "@type": "schema:Rating",
    "schema:ratingValue": "5",
    "schema:bestRating": "5"
  },
  "schema:itemReviewed": {
    "@type": "schema:Product",
    "schema:name": "Sony WH-1000XM5 Wireless Headphones"
  }
}
</script>

<script type="module">
import { init } from './src/shared.js';
import pane from './src/panes/review.js';

init({ pane, subject: '#review' });
