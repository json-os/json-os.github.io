<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pod Hosting - Service</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#service",
  "@type": "schema:Service",
  "schema:name": "Premium Solid Pod Hosting",
  "schema:description": "Enterprise-grade Solid Pod hosting with 99.9% uptime guarantee. Includes automatic backups, custom domain support, and priority support. Perfect for individuals and organizations who need reliable, privacy-respecting data storage.",
  "schema:serviceType": "Cloud Hosting",
  "schema:provider": {
    "@type": "schema:Organization",
    "schema:name": "SolidHost Pro"
  },
  "schema:areaServed": {
    "@type": "schema:Place",
    "schema:name": "Worldwide"
  },
  "schema:offers": {
    "@type": "schema:Offer",
    "schema:price": "9.99",
    "schema:priceCurrency": "USD"
  },
  "schema:aggregateRating": {
    "@type": "schema:AggregateRating",
    "schema:ratingValue": "4.9",
    "schema:reviewCount": "847"
  },
  "schema:termsOfService": { "@id": "https://solidhost.example/terms" },
  "schema:url": { "@id": "https://solidhost.example/premium" }
}
</script>

<script src="src/shared.js"></script>
<script>
  SchemaShared.init({
    pane: 'src/panes/service.js',
    subject: '#service'
  });
</script>

</body>
</html>
