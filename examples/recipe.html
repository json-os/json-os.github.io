<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Chocolate Chip Cookies - Recipe</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#recipe",
  "@type": "schema:Recipe",
  "schema:name": "Classic Chocolate Chip Cookies",
  "schema:description": "Soft and chewy chocolate chip cookies with crispy edges.",
  "schema:image": { "@id": "https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=640&q=80" },
  "schema:author": {
    "@type": "schema:Person",
    "schema:name": "Chef Bob"
  },
  "schema:prepTime": "PT15M",
  "schema:cookTime": "PT12M",
  "schema:totalTime": "PT27M",
  "schema:recipeYield": "24 cookies",
  "schema:recipeCategory": "Dessert",
  "schema:recipeCuisine": "American",
  "schema:recipeIngredient": [
    "2 1/4 cups flour",
    "1 cup butter, softened",
    "3/4 cup sugar",
    "3/4 cup brown sugar",
    "2 eggs",
    "1 tsp vanilla",
    "1 tsp baking soda",
    "2 cups chocolate chips"
  ],
  "schema:recipeInstructions": [
    "Preheat oven to 375°F (190°C).",
    "Mix flour and baking soda in a bowl.",
    "Beat butter and sugars until creamy.",
    "Add eggs and vanilla to butter mixture.",
    "Gradually blend in flour mixture.",
    "Stir in chocolate chips.",
    "Drop rounded tablespoons onto ungreased baking sheets.",
    "Bake for 9 to 11 minutes or until golden brown."
  ]
}
</script>
