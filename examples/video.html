<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Introduction to RDF - Video</title>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#video",
  "@type": "schema:VideoObject",
  "schema:name": "Introduction to RDF and Linked Data",
  "schema:description": "Learn the fundamentals of Resource Description Framework (RDF) and how it enables the Semantic Web. This comprehensive tutorial covers triples, URIs, vocabularies, and practical examples.",
  "schema:thumbnailUrl": { "@id": "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=640&q=80" },
  "schema:duration": "PT23M45S",
  "schema:uploadDate": "2024-02-20",
  "schema:interactionCount": "45892",
  "schema:author": {
    "@type": "schema:Person",
    "schema:name": "Dr. Sarah Chen",
    "schema:image": { "@id": "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&q=80" }
  },
  "schema:contentUrl": { "@id": "https://example.com/video/rdf-intro.mp4" }
}
</script>

<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; }
  #content { padding: 0; }
</style>

<script>
  async function loadScript(src) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function init() {
    await loadScript('/browser/dist/mashlib.min.js');

    await new Promise(resolve => {
      const check = setInterval(() => {
        if (typeof $rdf !== 'undefined' && typeof SolidLogic !== 'undefined') {
          clearInterval(check);
          resolve();
        }
      }, 50);
    });

    const island = document.querySelector('script[type="application/ld+json"]');
    if (island) {
      const store = SolidLogic.store;
      const baseUri = window.location.href.split('#')[0];
      const jsonld = JSON.parse(island.textContent);

      function addTriples(node, subjectUri) {
        const subject = $rdf.sym(subjectUri);
        if (node['@type']) {
          const type = node['@type'].replace('schema:', 'http://schema.org/');
          store.add(subject, $rdf.sym('http://www.w3.org/1999/02/22-rdf-syntax-ns#type'), $rdf.sym(type));
        }
        Object.keys(node).forEach(key => {
          if (key.startsWith('@')) return;
          const pred = key.replace('schema:', 'http://schema.org/');
          const val = node[key];
          if (typeof val === 'object' && val['@id']) {
            const uri = val['@id'].startsWith('http') ? val['@id'] : baseUri + val['@id'];
            store.add(subject, $rdf.sym(pred), $rdf.sym(uri));
          } else if (typeof val === 'object' && val['@type']) {
            const blankId = baseUri + '#_b' + Math.random().toString(36).substr(2,6);
            store.add(subject, $rdf.sym(pred), $rdf.sym(blankId));
            addTriples(val, blankId);
          } else if (typeof val === 'string') {
            store.add(subject, $rdf.sym(pred), val);
          }
        });
      }

      const rootId = baseUri + (jsonld['@id'] || '#thing');
      addTriples(jsonld, rootId);
    }

    await loadScript('src/toolbar.js');
    await loadScript('src/panes/video.js');

    const subject = $rdf.sym(window.location.href.split('#')[0] + '#video');
    const context = { dom: document, session: { store: SolidLogic.store } };

    const content = document.createElement('div');
    content.id = 'content';

    const views = {
      profile: () => window.SchemaVideoPane ? window.SchemaVideoPane.render(subject, context) : document.createTextNode('No pane'),
      data: () => {
        const div = document.createElement('div');
        div.style.cssText = 'padding: 32px; max-width: 800px; margin: 0 auto;';
        const table = document.createElement('table');
        table.style.cssText = 'width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px;';
        SolidLogic.store.statementsMatching(subject, null, null).forEach(st => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td style="padding:12px;color:#a78bfa;font-weight:500;width:30%;border-bottom:1px solid #334155;">${st.predicate.value.split(/[#\/]/).pop()}</td><td style="padding:12px;color:#e2e8f0;border-bottom:1px solid #334155;">${st.object.value}</td>`;
          table.appendChild(tr);
        });
        div.appendChild(table);
        return div;
      },
      source: () => {
        const div = document.createElement('div');
        div.style.cssText = 'padding: 32px; max-width: 800px; margin: 0 auto;';
        const pre = document.createElement('pre');
        pre.style.cssText = 'background: #1e293b; color: #e2e8f0; padding: 24px; border-radius: 12px; overflow-x: auto;';
        pre.textContent = JSON.stringify(JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent), null, 2);
        div.appendChild(pre);
        return div;
      }
    };

    function switchView(v) { content.innerHTML = ''; content.appendChild(views[v]()); }

    const toolbar = window.SchemaToolbar.render({
      dom: document, subject, theme: { primary: '#ef4444', bg: '#1e293b' },
      onViewChange: switchView, onRefresh: () => location.reload()
    });

    document.body.appendChild(toolbar);
    document.body.appendChild(content);
    switchView('profile');
  }
  init();
</script>

</body>
</html>
