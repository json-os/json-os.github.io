      text-decoration: none;
      font-size: 0.9rem;

    .btn-secondary {

      color: #e2e8f0;
      border: 1px solid #334155;
      cursor: pointer;

    .btn-secondary:hover { background: rgba(255,255,255,0.15); }
    .btn-primary {

      color: white;
      border: none;
      cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #e2e8f0;
      padding: 0.75rem 1.5rem;

      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 40% 60%;
      grid-template-rows: 1fr 1fr;
      min-height: 0;
    }

    /* Editor pane */
    .editor-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      min-height: 0;
    }

      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;

      font-size: 0.8rem;

      color: #e2e8f0;

      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
      outline: none;

      border-right: 1px solid #334155;
      border-top: 1px solid #334155;
      min-height: 0;

// Pane source cache
const paneSources = {};
let currentPaneSource = '';
let customPaneBlob = null;

// Load pane source code
async function loadPaneSource(type) {
  const url = `./src/panes/${type}.js`;
  if (!paneSources[type]) {
    const res = await fetch(url);
    paneSources[type] = await res.text();
  }
  return paneSources[type];
}

// Create pane from source code (supports editing)
async function createPaneFromSource(source) {
  // Revoke previous blob URL
  if (customPaneBlob) {
    URL.revokeObjectURL(customPaneBlob);
  }

  const blob = new Blob([source], { type: 'text/javascript' });
  customPaneBlob = URL.createObjectURL(blob);
  const module = await import(customPaneBlob);
  return module.default || module;
}

// Parse JSON-LD and add to store
function parseJsonLd(jsonStr) {
  const data = JSON.parse(jsonStr);
  const store = $rdf.graph();
  const baseUri = window.location.href;

  function addTriples(node, subjectUri) {
    const subject = $rdf.sym(subjectUri);
    const RDF = $rdf.Namespace('http://www.w3.org/1999/02/22-rdf-syntax-ns#');

    if (node['@type']) {
      const typeUri = node['@type'].replace('schema:', 'http://schema.org/');
      store.add(subject, RDF('type'), $rdf.sym(typeUri));
    }

    Object.entries(node).forEach(([key, val]) => {
      if (key.startsWith('@')) return;
      const pred = $rdf.sym(key.replace('schema:', 'http://schema.org/'));

      if (Array.isArray(val)) {
        val.forEach((item, i) => {
          if (typeof item === 'object' && !item['@id']) {
            const blankId = `${subjectUri}_${key}_${i}`;
            store.add(subject, pred, $rdf.sym(blankId));
            addTriples(item, blankId);
          } else if (typeof item === 'object' && item['@id']) {
            store.add(subject, pred, $rdf.sym(item['@id']));
          } else {
            store.add(subject, pred, item);
          }
        });
      } else if (typeof val === 'object' && val['@id']) {
        store.add(subject, pred, $rdf.sym(val['@id']));
      } else if (typeof val === 'object') {
        const blankId = `${subjectUri}_${key}`;
        store.add(subject, pred, $rdf.sym(blankId));
        addTriples(val, blankId);
      } else {
        store.add(subject, pred, val);
      }
    });
  }

  const subjectId = data['@id'] || '#thing';
  const fullUri = baseUri + subjectId;
  addTriples(data, fullUri);

  return { store, subjectUri: fullUri, data };
}

// Detect type from JSON-LD
function detectType(data) {
  const type = data['@type'] || '';
  const typeMap = {
    'schema:Person': 'person',
    'schema:Event': 'event',
    'schema:Article': 'article',
    'schema:Organization': 'organization',
    'schema:Recipe': 'recipe',
    'schema:Product': 'product',
    'schema:Place': 'place',
    'schema:Movie': 'movie',
    'schema:Book': 'book',
    'schema:Review': 'review',
    'schema:FAQPage': 'faqpage',
    'schema:HowTo': 'howto',
    'schema:JobPosting': 'jobposting',
    'schema:Restaurant': 'localbusiness',
    'schema:LocalBusiness': 'localbusiness',
    'schema:Service': 'service',
    'schema:Course': 'course',
    'schema:VideoObject': 'video',
    'schema:MusicRecording': 'musicrecording',
    'schema:SoftwareApplication': 'softwareapplication',
    'schema:CreativeWork': 'creativework'
  };
  return typeMap[type] || 'person';
}

// Track current pane type
let currentPaneType = 'person';

// Load pane source into editor
async function loadPaneCode(type) {
  try {
    const source = await loadPaneSource(type);
    paneCodeEl.value = source;
    currentPaneSource = source;
    currentPaneType = type;
    paneUrlEl.textContent = `${type}.js`;
    paneStatusDot.classList.remove('error');
    paneStatusText.textContent = 'Loaded';
  } catch (err) {
    paneCodeEl.value = `// Error loading ${type}.js: ${err.message}`;
    paneStatusDot.classList.add('error');
    paneStatusText.textContent = 'Error';
  }
}

// Render preview using current pane code
// Supports @view proposal: https://github.com/w3c/json-ld-syntax/issues/384
let renderTimeout;
async function render() {
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(async () => {
    try {
      const { store, subjectUri, data } = parseJsonLd(editor.value);
      const detectedType = detectType(data);

      // Load pane source if type changed or @view specified
      let paneSource = paneCodeEl.value;
      if (data['@view']) {
        // Fetch external @view source
        try {
          const res = await fetch(data['@view']);
          if (res.ok) {
            paneSource = await res.text();
            if (paneSource !== paneCodeEl.value) {
              paneCodeEl.value = paneSource;
              paneUrlEl.textContent = data['@view'].split('/').pop();
            }
          }
        } catch (e) {
          console.warn(`[jsonos] @view fetch failed:`, e);
        }
      } else if (detectedType !== currentPaneType) {
        await loadPaneCode(detectedType);
        paneSource = paneCodeEl.value;
      }

      // Create pane from current source code
      const pane = await createPaneFromSource(paneSource);

      const context = {
        session: { store },
        dom: document
      };

      preview.innerHTML = '';
      const rendered = pane.render($rdf.sym(subjectUri), context);
      preview.appendChild(rendered);

      statusDot.classList.remove('error');
      statusText.textContent = data['@view'] ? 'Valid (@view)' : 'Valid';
      paneStatusDot.classList.remove('error');
      paneStatusText.textContent = 'OK';
    } catch (err) {
      preview.innerHTML = `<div class="error-message">${err.message}</div>`;
      statusDot.classList.add('error');
      statusText.textContent = 'Error';
    }
  }, 300);
}

// Type selector change
typeSelect.addEventListener('change', async () => {
  const type = typeSelect.value;
  if (templates[type]) {
    editor.value = JSON.stringify(templates[type], null, 2);
    await loadPaneCode(type);
    render();
  }
});

// Editor input
editor.addEventListener('input', render);

// Pane code input - re-render when pane code changes
paneCodeEl.addEventListener('input', render);

// Toast notification
const toast = document.getElementById('toast');
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Copy HTML - generates standalone HTML file with @view
// Uses @view proposal: https://github.com/w3c/json-ld-syntax/issues/384
document.getElementById('copyHtml').addEventListener('click', () => {
  try {
    const data = JSON.parse(editor.value);
    const type = detectType(data);
    const viewUrl = `https://jsonos.com/examples/src/panes/${type}.js`;

    // Add @view to data if not present (self-describing view hint)
    const dataWithView = { ...data };
    if (!dataWithView['@view']) {
      dataWithView['@view'] = viewUrl;
    }

    const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>${data['schema:name'] || data['schema:headline'] || data['schema:title'] || 'Schema.org Pane'}</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<!-- JSON-LD with @view hint - see https://github.com/w3c/json-ld-syntax/issues/384 -->
<script type="application/ld+json">
${JSON.stringify(dataWithView, null, 2)}
<\/script>

<!-- One line embed - @view tells it which pane to use -->
<script src="https://jsonos.com/examples/embed.js"><\/script>

</body>
</html>`;
    navigator.clipboard.writeText(html);
    showToast('HTML copied!');
  } catch (e) {
    showToast('Error: Invalid JSON');
  }
});

// Copy URL - encodes JSON-LD in URL param
document.getElementById('copyUrl').addEventListener('click', () => {
  try {
    JSON.parse(editor.value); // validate
    const encoded = btoa(encodeURIComponent(editor.value));
    const url = `${window.location.origin}${window.location.pathname}?data=${encoded}`;
    navigator.clipboard.writeText(url);
    showToast('URL copied!');
  } catch (e) {
    showToast('Error: Invalid JSON');
  }
});

// Load from URL param on page load
const params = new URLSearchParams(window.location.search);
if (params.has('data')) {
  try {
    const decoded = decodeURIComponent(atob(params.get('data')));
    editor.value = decoded;
    const data = JSON.parse(decoded);
    const type = detectType(data);
    typeSelect.value = type;
  } catch (e) {
    console.error('Failed to load from URL:', e);
  }
}

// Initial load - pane code and render
loadPaneCode('person').then(() => render());
</script>

</body>
</html>
