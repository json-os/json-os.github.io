<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Solid Project - Organization</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#org",
  "@type": "schema:Organization",
  "@view": "https://jsonos.com/examples/src/panes/organization.js",
  "schema:name": "Solid Project",
  "schema:description": "Re-decentralizing the web. Solid gives people control over their data.",
  "schema:url": { "@id": "https://solidproject.org" },
  "schema:logo": { "@id": "https://solidproject.org/assets/img/solid-emblem.svg" },
  "schema:foundingDate": "2015",
  "schema:founder": {
    "@type": "schema:Person",
    "schema:name": "Tim Berners-Lee",
    "schema:url": { "@id": "https://www.w3.org/People/Berners-Lee/" }
  },
  "schema:member": [
    {
      "@type": "schema:Person",
      "schema:name": "Tim Berners-Lee",
      "schema:jobTitle": "Project Lead"
    },
    {
      "@type": "schema:Person",
      "schema:name": "Melvin Carvalho",
      "schema:jobTitle": "Developer"
    },
    {
      "@type": "schema:Person",
      "schema:name": "Andrei Sambra",
      "schema:jobTitle": "Developer"
    },
    {
      "@type": "schema:Person",
      "schema:name": "Ruben Verborgh",
      "schema:jobTitle": "Researcher"
    },
    {
      "@type": "schema:Person",
      "schema:name": "Oshani Seneviratne",
      "schema:jobTitle": "Researcher"
    }
  ]
}
</script>

<script type="module">
import { init } from './src/shared.js';
import pane from './src/panes/organization.js';

init({ pane, subject: '#org' });
</script>

</body>
</html>
