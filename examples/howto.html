<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Build a Birdhouse - HowTo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#howto",
  "@type": "schema:HowTo",
  "schema:name": "How to Build a Simple Birdhouse",
  "schema:description": "Learn to build a charming birdhouse for your garden using basic woodworking skills. Perfect for beginners!",
  "schema:image": { "@id": "https://images.unsplash.com/photo-1520808663317-647b476a81b9?w=640&q=80" },
  "schema:totalTime": "PT2H30M",
  "schema:estimatedCost": {
    "@type": "schema:MonetaryAmount",
    "schema:currency": "USD",
    "schema:value": "25"
  },
  "schema:supply": [
    { "@type": "schema:HowToSupply", "schema:name": "Cedar board (1x6x8)" },
    { "@type": "schema:HowToSupply", "schema:name": "Wood screws (1.5 inch)" },
    { "@type": "schema:HowToSupply", "schema:name": "Wood glue" },
    { "@type": "schema:HowToSupply", "schema:name": "Sandpaper (120 grit)" }
  ],
  "schema:tool": [
    { "@type": "schema:HowToTool", "schema:name": "Circular saw or hand saw" },
    { "@type": "schema:HowToTool", "schema:name": "Drill with bits" },
    { "@type": "schema:HowToTool", "schema:name": "Measuring tape" },
    { "@type": "schema:HowToTool", "schema:name": "Pencil" }
  ],
  "schema:step": [
    { "@type": "schema:HowToStep", "schema:name": "Cut the pieces", "schema:text": "Using your saw, cut the cedar board into 6 pieces: front, back, two sides, floor, and roof. The front piece needs a 1.5 inch entrance hole." },
    { "@type": "schema:HowToStep", "schema:name": "Sand all edges", "schema:text": "Use 120 grit sandpaper to smooth all cut edges. This prevents splinters and helps the pieces fit together better." },
    { "@type": "schema:HowToStep", "schema:name": "Assemble the box", "schema:text": "Apply wood glue to the edges and use screws to attach the sides to the floor. Then attach the front and back panels." },
    { "@type": "schema:HowToStep", "schema:name": "Attach the roof", "schema:text": "Position the roof piece so it overhangs the front by 2 inches. Secure with screws, leaving one side hinged for cleaning access." },
    { "@type": "schema:HowToStep", "schema:name": "Add drainage holes", "schema:text": "Drill 4 small holes in the floor corners for drainage. This keeps the birdhouse dry during rain." }
  ]
}
</script>

<script type="module">
