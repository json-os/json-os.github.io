<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Senior Developer - JobPosting</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8fafc; }
  </style>
</head>
<body>

<script type="application/ld+json">
{
  "@context": {
    "schema": "http://schema.org/"
  },
  "@id": "#job",
  "@type": "schema:JobPosting",
  "schema:title": "Senior Full Stack Developer",
  "schema:description": "We're looking for an experienced developer to join our growing team. You'll work on exciting projects using modern technologies and contribute to our open-source initiatives.",
  "schema:datePosted": "2025-01-10",
  "schema:validThrough": "2025-03-01",
  "schema:employmentType": "FULL_TIME",
  "schema:hiringOrganization": {
    "@type": "schema:Organization",
    "schema:name": "TechStart Inc.",
    "schema:logo": { "@id": "https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=100&q=80" }
  },
  "schema:jobLocation": {
    "@type": "schema:Place",
    "schema:address": {
      "@type": "schema:PostalAddress",
      "schema:addressLocality": "San Francisco",
      "schema:addressRegion": "CA"
    }
  },
  "schema:baseSalary": {
    "@type": "schema:MonetaryAmount",
    "schema:currency": "USD",
    "schema:minValue": "150000",
    "schema:maxValue": "200000"
  },
  "schema:skills": "JavaScript, TypeScript, React, Node.js, PostgreSQL, AWS",
  "schema:qualifications": "5+ years of experience, Strong problem-solving skills, Experience with agile methodologies, Excellent communication",
  "schema:responsibilities": "Design and implement new features, Code review and mentoring, Collaborate with product team, Maintain documentation",
  "schema:url": { "@id": "https://techstart.example/careers/senior-dev" }
}
</script>

<script src="src/shared.js"></script>
<script>
  SchemaShared.init({
    pane: 'src/panes/jobposting.js',
    subject: '#job'
  });
</script>

</body>
</html>
